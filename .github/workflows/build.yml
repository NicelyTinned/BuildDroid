name: Build BuildDroid APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BuildDroid-source.zip'
      - '.github/workflows/build-builddroid.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build BuildDroid
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Verify source archive exists
        shell: bash
        run: |
          if [[ ! -f "$GITHUB_WORKSPACE/BuildDroid-source.zip" ]]; then
            echo "Missing BuildDroid-source.zip in the repository root."
            echo "Upload the source ZIP to the repository root, then run this workflow again."
            exit 1
          fi

      - name: Unzip BuildDroid source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/builddroid-source"
          unzip -q "$GITHUB_WORKSPACE/BuildDroid-source.zip" -d "$RUNNER_TEMP/builddroid-source"

          PROJECT_DIR="$RUNNER_TEMP/builddroid-source/BuildDroid"
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" || ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "The archive does not contain the expected BuildDroid/ Android project folder."
            echo "Re-upload the unmodified BuildDroid-source.zip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        shell: bash
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug

      - name: Upload BuildDroid APK
        uses: actions/upload-artifact@v7
        with:
          name: BuildDroid-debug-apk
          path: ${{ runner.temp }}/builddroid-source/BuildDroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports if the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuildDroid-test-reports
          path: ${{ runner.temp }}/builddroid-source/BuildDroid/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
          
